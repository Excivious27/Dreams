name: Build and deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/godot" "$T"
          cd "$HOME/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${V}_linux.x86_64" godot
          chmod +x godot
          rm godot.zip
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q templates.tpz
          mv templates/web_nothreads_release.zip templates/web_nothreads_debug.zip "$T/"
          rm -rf templates templates.tpz

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # Re-importing ~15k textures takes minutes; keep them between deploys.
      - name: Cache imported assets
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('art/gen/manifest.json', 'project.godot') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Import project and run smoke test
        run: bash tools/check.sh

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.pck
          # Phones download the whole pack before the game starts: report it, and
          # stop a deploy that has ballooned (Pages sites should stay under 1 GB).
          size=$(stat -c %s build/web/index.pck)
          echo "index.pck: $((size / 1048576)) MB"
          echo "### index.pck: $((size / 1048576)) MB" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -lt 167772160 || { echo "pck over 160 MB: is new art imported lossless? run tools/set_import_lossy.py"; exit 1; }

      # Phones must get the NEW game when they update: the service worker's own
      # downloads skip the browser's 10-minute HTTP cache.
      - name: Make updates bypass the HTTP cache
        run: |
          sw=build/web/index.service.worker.js
          grep -q "cache.addAll(CACHED_FILES)" "$sw"
          grep -q "self.fetch(event.request)" "$sw"
          sed -i "s|cache.addAll(CACHED_FILES)|cache.addAll(CACHED_FILES.map((u) => new Request(u, {cache: 'reload'})))|" "$sw"
          sed -i "s|self.fetch(event.request)|self.fetch(event.request.mode === 'navigate' ? event.request : new Request(event.request, {cache: 'no-cache'}))|" "$sw"
          grep -q "cache: 'reload'" "$sw"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
