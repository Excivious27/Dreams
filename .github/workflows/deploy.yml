name: Build and deploy web

on:
  push:
    branches: [main]
    # Uploads, handoffs and reports don't change the game: no deploy (C9 P4).
    paths-ignore:
      - "docs/**"
      - "reference/**"
      - "art/incoming/**"
      - "audio/incoming/**"
      - "ci/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A running deploy always finishes; newer pushes wait and only the latest
# waiting one runs next (C9 P4: 94 of 100 deploys were being cancelled).
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.5.1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.same.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/godot" "$T"
          cd "$HOME/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${V}_linux.x86_64" godot
          chmod +x godot
          rm godot.zip
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q templates.tpz
          mv templates/web_nothreads_release.zip templates/web_nothreads_debug.zip "$T/"
          rm -rf templates templates.tpz

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # Re-importing ~15k textures takes minutes; keep them between deploys.
      - name: Cache imported assets
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('art/gen/manifest.json', 'project.godot') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Python deps (numpy for the music/sfx checks)
        run: pip install --quiet numpy && (command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null))
      # The full tools/check.sh gates merges on the CONDUCT CI shards
      # (.github/workflows/conduct-ci.yml); the deploy only needs a clean
      # import and the smoke test, so it can't be blocked by a slow or
      # order-dependent test (C9 P4).
      - name: Import project and run smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tail -n 20
          out="$(godot --headless --path . -s res://tools/smoke_test.gd 2>&1)"; code=$?
          echo "$out" | tail -n 40
          test $code -eq 0 || { echo "smoke test exited $code"; exit 1; }
          echo "$out" | grep -q "SMOKE DONE, failures: 0" || { echo "smoke test did not pass"; exit 1; }
          if echo "$out" | grep -vE "still in use at exit|leaked at exit|_free_rids|resource.cpp|renderer_canvas_cull" | grep -qE "SCRIPT ERROR|Parse Error"; then
            echo "$out" | grep -E "SCRIPT ERROR|Parse Error" | sort | uniq -c | sort -rn | head -n 20; exit 1
          fi
          python3 tools/web_head.py --check
          python3 tools/music_stream.py --check

      - name: Export web build
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.pck
          # Streamed music (data/music_stream.json) sits next to the game; Music fetches it on demand.
          mkdir -p build/web/music
          python3 -c "import json;print('\n'.join(json.load(open('data/music_stream.json'))['stream']))" | while read t; do cp "audio/music/$t.ogg" build/web/music/; done
          want=$(python3 -c "import json;print(len(json.load(open('data/music_stream.json'))['stream']))")
          got=$(ls build/web/music/*.ogg | wc -l)
          echo "streamed music: $got of $want files, $(du -sh build/web/music | cut -f1)"
          test "$got" -eq "$want" || { echo "music/ has $got songs, data/music_stream.json lists $want: rerun tools/music_stream.py"; exit 1; }
          # Phones download the whole pack before the game starts: report it, and
          # stop a deploy that has ballooned (Pages sites should stay under 1 GB).
          size=$(stat -c %s build/web/index.pck)
          echo "index.pck: $((size / 1048576)) MB"
          echo "### index.pck: $((size / 1048576)) MB" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -lt 146800640 || { echo "pck over 140 MB: is new art imported lossless? run tools/set_import_lossy.py"; exit 1; }

      # Service worker (cache bypass, offline launch from /Dreams/), maskable
      # icons, build.json (web/post_export.py).
      - name: Patch the export
        run: python3 web/post_export.py build/web "${{ github.sha }}"

      # An unchanged game (same pck, wasm and songs) is not re-uploaded: every
      # deploy makes phones download the whole pack again.
      - name: Skip an unchanged game
        id: same
        run: |
          live=$(curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/build.json" 2>/dev/null || echo '{}')
          now=$(python3 -c "import json;print(json.dumps(json.load(open('build/web/build.json'))['game'],sort_keys=True))")
          was=$(echo "$live" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d.get('game',{}),sort_keys=True))" 2>/dev/null || echo "")
          if [ "$now" = "$was" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "### game unchanged: deploy skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "### deploying ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5
        if: steps.same.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.same.outputs.changed == 'true'
        with:
          path: build/web

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # The streamed songs are really on the site (a 404 would leave only the stand-ins).
      - name: Smoke-fetch a streamed song
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsI "${{ steps.deployment.outputs.page_url }}music/town.ogg" && exit 0
            sleep 20
          done
          echo "music/town.ogg not reachable on the deployed site"; exit 1

  # Steam Deck / Linux native build: export with the "Linux" preset and start it
  # headless for a few seconds, so the preset stays valid (docs/STEAM-DECK.md).
  # Runs beside the web build; it never blocks the web deploy.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and Linux export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot and Linux export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/godot" "$T"
          cd "$HOME/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${V}_linux.x86_64" godot
          chmod +x godot
          rm godot.zip
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q templates.tpz
          mv templates/linux_release.x86_64 templates/linux_debug.x86_64 "$T/"
          rm -rf templates templates.tpz
      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"
      - name: Cache imported assets
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('art/gen/manifest.json', 'project.godot') }}
          restore-keys: |
            godot-import-linux-${{ env.GODOT_VERSION }}-
      - name: Export and start the Linux build
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tail -n 5
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux" build/linux/Dreams.x86_64 2>&1 | tail -n 20
          test -x build/linux/Dreams.x86_64
          echo "### Linux build: $(( $(stat -c %s build/linux/Dreams.x86_64) / 1048576 )) MB" >> "$GITHUB_STEP_SUMMARY"
          out="$(timeout 120 build/linux/Dreams.x86_64 --headless --quit-after 300 2>&1)"; echo "$out" | tail -n 30
          if echo "$out" | grep -E "SCRIPT ERROR|Parse Error|Failed to load" ; then exit 1; fi
