name: CONDUCT CI (check shards + 20 bots + live relay)

# Heavy CONDUCT runs off the 2-CPU sandbox: push a commit to ci/<label>-<sha>
# (tools/conduct/ci_run.sh does it). Never deploys; deploy.yml stays the only deploy.
# ci/params.json (from ci_run.sh) picks the jobs: "shards" (check shards to run),
# "bots" (20 bots on/off), "playtest". Fix agents' pre-merge runs: ci_run.sh --shards a,b [--bots]
# (bots off unless --bots; --bots-only = bots alone). A failing bot or playtest is retried once (FLAKY if it passes).
on:
  push:
    branches: ['ci/**', 'main']
    # main: only a relay/co-op change runs this, and then only the live relay check
    # (the box deploys server/ from main within 10 min; the relay job waits for it).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # main pushes each get their own group: a later push must not cancel a relay check
  # that is waiting for its server/ deploy.
  group: conduct-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  # S1: bots, playtest and check.sh never start Steam (SteamSvc also refuses CI/headless).
  DREAMS_NO_STEAM: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      bots: ${{ steps.p.outputs.bots }}
      playtest: ${{ steps.p.outputs.playtest }}
      import_key: ${{ steps.p.outputs.import_key }}
      relay: ${{ steps.p.outputs.relay }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt
      - name: Restore apt downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ci-apt
          key: ci-apt-${{ runner.os }}-${{ hashFiles('tools/ci_deps_check.py') }}
      # ONE apt line: the package list lives in tools/ci_deps_check.py (BINARIES); apt runs only for missing tools.
      - name: CI deps (pip + apt, cached) + ci_deps_check
        run: |
          mkdir -p ~/.cache/ci-apt/partial
          pip install --quiet -r tools/ci-requirements.txt
          miss="$(python3 tools/ci_deps_check.py --apt-missing)"
          if [ -n "$miss" ]; then
            echo "apt: $miss"
            sudo apt-get update -qq
            sudo apt-get install -y -qq -o Dir::Cache::Archives="$HOME/.cache/ci-apt" $miss > /dev/null
            sudo chown -R "$(id -u):$(id -g)" ~/.cache/ci-apt
          fi
          python3 tools/ci_deps_check.py
      - name: Read ci/params.json
        id: p
        run: |
          # A push to main (not a ci/** run): only the live relay check, and only when it
          # changed server/, scripts/net.gd or the relay tests; it writes ci/params.json for the others.
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            before="${{ github.event.before }}"
            git fetch -q --depth 1 origin "$before" 2>/dev/null || true
            ch="$(git diff --name-only "$before" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo server/)"
            srv=false; netc=false; rel=false
            echo "$ch" | grep -q '^server/' && srv=true
            echo "$ch" | grep -qE '^scripts/net(_api|_transport[a-z_]*|_relay_room)?\.gd$' && netc=true
            if [ $srv = true ] || [ $netc = true ] || echo "$ch" | grep -qE '^tools/(relay_test\.js|net_e2e|conduct/relay_live_check\.py)'; then rel=true; fi
            mkdir -p ci
            echo "{\"label\": \"main-push\", \"shards\": [], \"bots\": false, \"playtest\": false, \"relay\": $rel, \"server_changed\": $srv, \"e2e\": $rel, \"e2e_strict\": $netc}" > ci/params.json
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              p = json.load(open("ci/params.json"))
          except (OSError, ValueError):
              p = {}
          sh = [int(x) for x in p.get("shards", [1, 2, 3, 4, 5, 6]) if 1 <= int(x) <= 6]
          print("shards=" + json.dumps(sh))
          print("bots=" + json.dumps(list(range(1, 21)) if p.get("bots", True) else []))
          print("playtest=" + ("true" if p.get("playtest", True) else "false"))
          print("relay=" + ("true" if p.get("relay", False) else "false"))
          PY
          echo "import_key=godot-import-${GODOT_VERSION}-${{ hashFiles('art/**/*.import', 'audio/**/*.import', 'project.godot') }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: params
          path: ci/params.json
          retention-days: 7

  check:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt
      - name: Restore apt downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ci-apt
          key: ci-apt-${{ runner.os }}-${{ hashFiles('tools/ci_deps_check.py') }}
      # ONE apt line: the package list lives in tools/ci_deps_check.py (BINARIES); apt runs only for missing tools.
      - name: CI deps (pip + apt, cached) + ci_deps_check
        run: |
          mkdir -p ~/.cache/ci-apt/partial
          pip install --quiet -r tools/ci-requirements.txt
          miss="$(python3 tools/ci_deps_check.py --apt-missing)"
          if [ -n "$miss" ]; then
            echo "apt: $miss"
            sudo apt-get update -qq
            sudo apt-get install -y -qq -o Dir::Cache::Archives="$HOME/.cache/ci-apt" $miss > /dev/null
            sudo chown -R "$(id -u):$(id -g)" ~/.cache/ci-apt
          fi
          python3 tools/ci_deps_check.py
      - name: Restore Godot (same key as deploy.yml)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web
      - name: Download Godot if the cache missed
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot"; cd "$HOME/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip; mv "Godot_v${V}_linux.x86_64" godot; chmod +x godot; rm godot.zip
      - run: echo "$HOME/godot" >> "$GITHUB_PATH"
      # Import cache: saved only by green runs on main (deploy.yml, or save-import below on a
      # main dispatch). Caches saved on ci/** branches are invisible to other branches.
      - name: Restore imported assets (same key as deploy.yml)
        uses: actions/cache/restore@v4
        with:
          path: .godot
          key: ${{ needs.plan.outputs.import_key }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-
      - name: check.sh shard ${{ matrix.shard }}/6
        run: |
          mkdir -p out
          start=$(date +%s)
          set +e
          CHECK_TIMES="$PWD/out/times_${{ matrix.shard }}.jsonl" CHECK_SHARD="${{ matrix.shard }}/6" bash tools/check.sh > "out/shard_${{ matrix.shard }}.log" 2>&1
          rc=$?
          set -e
          echo "{\"shard\": ${{ matrix.shard }}, \"rc\": $rc, \"secs\": $(( $(date +%s) - start ))}" > "out/shard_${{ matrix.shard }}.json"
          tail -n 40 "out/shard_${{ matrix.shard }}.log"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          retention-days: 7

  bots:
    needs: plan
    if: needs.plan.outputs.bots != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        bot: ${{ fromJSON(needs.plan.outputs.bots) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt
      - name: Restore apt downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ci-apt
          key: ci-apt-${{ runner.os }}-${{ hashFiles('tools/ci_deps_check.py') }}
      # ONE apt line: the package list lives in tools/ci_deps_check.py (BINARIES); apt runs only for missing tools.
      - name: CI deps (pip + apt, cached) + ci_deps_check
        run: |
          mkdir -p ~/.cache/ci-apt/partial
          pip install --quiet -r tools/ci-requirements.txt
          miss="$(python3 tools/ci_deps_check.py --apt-missing)"
          if [ -n "$miss" ]; then
            echo "apt: $miss"
            sudo apt-get update -qq
            sudo apt-get install -y -qq -o Dir::Cache::Archives="$HOME/.cache/ci-apt" $miss > /dev/null
            sudo chown -R "$(id -u):$(id -g)" ~/.cache/ci-apt
          fi
          python3 tools/ci_deps_check.py
      - name: Restore Godot (same key as deploy.yml)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web
      - name: Download Godot if the cache missed
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot"; cd "$HOME/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip; mv "Godot_v${V}_linux.x86_64" godot; chmod +x godot; rm godot.zip
      - run: echo "$HOME/godot" >> "$GITHUB_PATH"
      # Import cache: saved only by green runs on main (deploy.yml, or save-import below on a
      # main dispatch). Caches saved on ci/** branches are invisible to other branches.
      - name: Restore imported assets (same key as deploy.yml)
        uses: actions/cache/restore@v4
        with:
          path: .godot
          key: ${{ needs.plan.outputs.import_key }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-
      # A failing bot runs once more (fresh save): pass on the retry = FLAKY (green), twice = red.
      - name: Bot ${{ matrix.bot }} (one retry)
        run: |
          mkdir -p out
          n=${{ matrix.bot }}
          days=$(python3 -c "import json;print(json.load(open('ci/params.json')).get('days',3))" 2>/dev/null || echo 3)
          focus=$(python3 -c "import json;print(json.load(open('ci/params.json')).get('focus',''))" 2>/dev/null || echo "")
          spec=$(bash tools/conduct/bot_spec.sh $n)
          godot --headless --path . --import > /dev/null 2>&1 || true
          start=$(date +%s); attempts=0; first_rc=null; first_line=""
          set +e
          while [ $attempts -lt 2 ]; do
            attempts=$((attempts + 1))
            rm -rf out/data
            BOT_FOCUS="$focus" XDG_DATA_HOME="$PWD/out/data" timeout 1500 godot --headless --path . -s res://tools/bot.gd -- $spec "$days" > "out/bot$n.log" 2>&1
            rc=$?
            if grep -q "BOT $n done" "out/bot$n.log" && ! grep -qE "BOT FAIL|SCRIPT ERROR" "out/bot$n.log"; then ok=1; else ok=0; fi
            [ $ok = 1 ] && break
            if [ $attempts = 1 ]; then
              first_rc=$rc
              first_line=$( (grep -m1 -E "BOT FAIL|SCRIPT ERROR" "out/bot$n.log" || tail -n 1 "out/bot$n.log") | tr -d '"\\' | tr -cd '[:print:]' | cut -c1-120)
              mv "out/bot$n.log" "out/bot${n}_try1.log"
              echo "bot $n failed (rc=$rc): retrying once"
            fi
          done
          set -e
          echo "{\"bot\": $n, \"spec\": \"$spec\", \"days\": $days, \"rc\": $rc, \"secs\": $(( $(date +%s) - start )), \"attempts\": $attempts, \"first_rc\": $first_rc, \"first_line\": \"$first_line\"}" > "out/bot$n.json"
          rm -rf out/data
          tail -n 5 "out/bot$n.log"
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-${{ matrix.bot }}
          path: out/
          retention-days: 7

  playtest:
    needs: plan
    if: needs.plan.outputs.playtest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt
      - name: Restore apt downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ci-apt
          key: ci-apt-${{ runner.os }}-${{ hashFiles('tools/ci_deps_check.py') }}
      # ONE apt line: the package list lives in tools/ci_deps_check.py (BINARIES); apt runs only for missing tools.
      - name: CI deps (pip + apt, cached) + ci_deps_check
        run: |
          mkdir -p ~/.cache/ci-apt/partial
          pip install --quiet -r tools/ci-requirements.txt
          miss="$(python3 tools/ci_deps_check.py --apt-missing)"
          if [ -n "$miss" ]; then
            echo "apt: $miss"
            sudo apt-get update -qq
            sudo apt-get install -y -qq -o Dir::Cache::Archives="$HOME/.cache/ci-apt" $miss > /dev/null
            sudo chown -R "$(id -u):$(id -g)" ~/.cache/ci-apt
          fi
          python3 tools/ci_deps_check.py
      - name: Restore Godot (same key as deploy.yml)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web
      - name: Download Godot if the cache missed
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot"; cd "$HOME/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip; mv "Godot_v${V}_linux.x86_64" godot; chmod +x godot; rm godot.zip
      - run: echo "$HOME/godot" >> "$GITHUB_PATH"
      # Import cache: saved only by green runs on main (deploy.yml, or save-import below on a
      # main dispatch). Caches saved on ci/** branches are invisible to other branches.
      - name: Restore imported assets (same key as deploy.yml)
        uses: actions/cache/restore@v4
        with:
          path: .godot
          key: ${{ needs.plan.outputs.import_key }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-
      # A failing playtest runs once more: pass on the retry = FLAKY (green), twice = red.
      - name: Scripted playtest with screenshots (one retry)
        run: |
          mkdir -p out
          godot --headless --path . --import > /dev/null 2>&1 || true
          start=$(date +%s); attempts=0; first_rc=null; first_fail=""
          set +e
          while [ $attempts -lt 2 ]; do
            attempts=$((attempts + 1))
            rm -rf out/data out/shots; mkdir -p out/shots
            XDG_DATA_HOME="$PWD/out/data" timeout 1500 xvfb-run -a godot --path . --rendering-driver opengl3 --resolution 540x960 --fixed-fps 60 -s res://tools/playtest.gd -- "$PWD/out/shots" > out/playtest.log 2>&1
            rc=$?
            [ $rc = 0 ] && break
            if [ $attempts = 1 ]; then
              first_rc=$rc
              first_fail=$( (grep -m1 -E "FAIL|SCRIPT ERROR" out/playtest.log || tail -n 1 out/playtest.log) | tr -d '"\\' | tr -cd '[:print:]' | cut -c1-120)
              mv out/playtest.log out/playtest_try1.log
              echo "playtest failed (rc=$rc): retrying once"
            fi
          done
          set -e
          echo "{\"rc\": $rc, \"secs\": $(( $(date +%s) - start )), \"shots\": $(ls out/shots | wc -l), \"attempts\": $attempts, \"first_rc\": $first_rc, \"first_fail\": \"$first_fail\"}" > out/playtest.json
          rm -rf out/data
          tail -n 8 out/playtest.log
          exit $rc
      # S1 P4: Steam Deck performance guard (1280x800, both arcs). Reported, not blocking yet:
      # llvmpipe frame times on a runner are noisy (see tools/deck_perf_check.py).
      - name: Deck perf check (DECK PERF line in the summary)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          XDG_DATA_HOME="$(mktemp -d)" timeout 1200 python3 tools/deck_perf_check.py --json out/deck_perf.json 2>&1 | tee out/deck_perf.txt | tail -n 25
          echo "### $(grep -m1 'DECK PERF' out/deck_perf.txt || echo 'DECK PERF: no result')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest
          path: out/
          retention-days: 7

  # Live relay check (tools/conduct/relay_live_check.py): two clients on the live wss relay
  # (create, join, world, round trips -> "RELAY: ok, Xms" in summary.txt) and, when net.gd or
  # server/ changed, two headless Godot instances playing together on it (tools/net_e2e.sh).
  # A relay outage only fails the run when this run changed server/ and that server is live.
  relay:
    needs: plan
    if: needs.plan.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: params
          path: ci
      - name: Need Godot? (NET E2E)
        id: e2e
        run: python3 -c "import json;print('on=' + ('true' if json.load(open('ci/params.json')).get('e2e') else 'false'))" >> "$GITHUB_OUTPUT"
      - name: Restore Godot (same key as deploy.yml)
        if: steps.e2e.outputs.on == 'true'
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web
      - name: Download Godot if the cache missed
        if: steps.e2e.outputs.on == 'true' && steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot"; cd "$HOME/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip; mv "Godot_v${V}_linux.x86_64" godot; chmod +x godot; rm godot.zip
      - if: steps.e2e.outputs.on == 'true'
        run: echo "$HOME/godot" >> "$GITHUB_PATH"
      - name: Restore imported assets (same key as deploy.yml)
        if: steps.e2e.outputs.on == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .godot
          key: ${{ needs.plan.outputs.import_key }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-
      - name: Import (NET E2E)
        if: steps.e2e.outputs.on == 'true'
        run: godot --headless --path . --import > /dev/null 2>&1 || true
      - name: Live relay check (node --version; waits for a server/ deploy up to 15 min)
        run: |
          node --version
          NET_E2E_DIR="$PWD/out/relay/e2e" python3 tools/conduct/relay_live_check.py out/relay ci/params.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay
          path: out/relay/
          retention-days: 7

  # Only a run on main itself (workflow_dispatch on main) can save a cache other
  # branches see; ci/** runs restore what deploy.yml saved from main.
  save-import:
    needs: [plan, check]
    if: github.ref == 'refs/heads/main' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore Godot (same key as deploy.yml)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web
      - name: Download Godot if the cache missed
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot"; cd "$HOME/godot"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip; mv "Godot_v${V}_linux.x86_64" godot; chmod +x godot; rm godot.zip
      - run: echo "$HOME/godot" >> "$GITHUB_PATH"
      # Import cache: saved only by green runs on main (deploy.yml, or save-import below on a
      # main dispatch). Caches saved on ci/** branches are invisible to other branches.
      - name: Restore imported assets (same key as deploy.yml)
        uses: actions/cache/restore@v4
        with:
          path: .godot
          key: ${{ needs.plan.outputs.import_key }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-
      - name: Import
        run: godot --headless --path . --import 2>&1 | tail -n 5
      - uses: actions/cache/save@v4
        with:
          path: .godot
          key: ${{ needs.plan.outputs.import_key }}

  report:
    needs: [plan, check, bots, playtest, relay]
    if: always() && (needs.plan.outputs.relay == 'true' || github.ref != 'refs/heads/main' || github.event_name != 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools
            ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt
      - name: Restore apt downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ci-apt
          key: ci-apt-${{ runner.os }}-${{ hashFiles('tools/ci_deps_check.py') }}
      # ONE apt line: the package list lives in tools/ci_deps_check.py (BINARIES); apt runs only for missing tools.
      - name: CI deps (pip + apt, cached) + ci_deps_check
        run: |
          mkdir -p ~/.cache/ci-apt/partial
          pip install --quiet -r tools/ci-requirements.txt
          miss="$(python3 tools/ci_deps_check.py --apt-missing)"
          if [ -n "$miss" ]; then
            echo "apt: $miss"
            sudo apt-get update -qq
            sudo apt-get install -y -qq -o Dir::Cache::Archives="$HOME/.cache/ci-apt" $miss > /dev/null
            sudo chown -R "$(id -u):$(id -g)" ~/.cache/ci-apt
          fi
          python3 tools/ci_deps_check.py
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Summarise
        run: |
          mkdir -p ci  # main has no ci/ (relay-only runs): the plan's params artifact goes here
          if [ -f results/params/params.json ]; then cp results/params/params.json ci/params.json; fi
          python3 tools/conduct/ci_summary.py results "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.run_id }}" ci/params.json
          cat results/summary.txt
          cat results/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Push results to ci-results/<sha>/
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          sha="${{ github.sha }}"
          url="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4; do
            rm -rf /tmp/cr
            if git clone -q --depth 1 --branch ci-results "$url" /tmp/cr 2>/dev/null; then :; else
              mkdir -p /tmp/cr && cd /tmp/cr && git init -q && git checkout -q -b ci-results && git remote add origin "$url" && cd - >/dev/null
            fi
            cd /tmp/cr
            git config user.name "conduct-ci"; git config user.email "conduct-ci@users.noreply.github.com"
            for d in */; do d=${d%/}; [ -f "$d/summary.json" ] || continue
              old=$(python3 -c "import json,time;print(1 if time.time()-json.load(open('$d/summary.json')).get('finished',time.time())>7*86400 else 0)")
              [ "$old" = 1 ] && rm -rf "$d"; done
            rm -rf "$sha"; cp -r "$GITHUB_WORKSPACE/results" "$sha"
            find "$sha" -name '*.log' -size +2M -exec sh -c 'tail -c 2000000 "$1" > "$1.t" && mv "$1.t" "$1"' _ {} \;
            git add -A
            git commit -qm "CI results for $sha (${{ github.ref_name }})" || true
            if git push -q origin ci-results; then echo "pushed results"; exit 0; fi
            cd "$GITHUB_WORKSPACE"; sleep $((i * 5))
          done
          echo "results push failed"; exit 1
