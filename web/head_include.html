<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121220">
<style>html,body,#canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}#dreams-rot{display:none}@media (orientation:landscape) and (pointer:coarse) and (max-height:520px){#dreams-rot{display:flex;position:fixed;inset:0;z-index:9998;background:#121220;color:#f2c55c;font:bold 18px sans-serif;align-items:center;justify-content:center;text-align:center;padding:24px}}#status{background:#121220!important}#status-progress{width:70%!important;max-width:360px;height:14px;accent-color:#f2c55c}#status-notice{font-family:sans-serif}#status::before{content:"DREAMS";display:block;color:#f2c55c;font:bold 32px sans-serif;letter-spacing:6px;margin-bottom:18px;text-align:center}</style>
<script>
(function(){
document.addEventListener('visibilitychange',function(){if(!document.hidden)window.dreamsWoke=1;});
if(!('serviceWorker' in navigator))return;
var reloading=false;
navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloading)return;reloading=true;location.reload();});
function apply(w){
 window.dreamsUpdateReady=true;
 if(window.dreamsCoop){setTimeout(function(){apply(w);},5000);return;}
 var loading=document.getElementById('status');
 if(loading&&loading.style.display!=='none'&&getComputedStyle(loading).visibility!=='hidden'){w.postMessage('claim');return;}
 if(document.getElementById('dreams-upd'))return;
 var b=document.createElement('div');b.id='dreams-upd';
 b.textContent='New version of Dreams ready. Tap here to update (your farm is saved).';
 b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#f2c55c;color:#1b1430;font:bold 14px sans-serif;padding:10px 34px 10px 10px;border-radius:10px;text-align:center;box-shadow:0 2px 10px #0008';
 var x=document.createElement('span');x.textContent='\u00d7';x.title='Later';x.style.cssText='position:absolute;right:4px;top:0;bottom:0;width:30px;display:flex;align-items:center;justify-content:center;font-size:20px';
 x.onclick=function(e){e.stopPropagation();window.dreamsUpdateLater=true;b.style.left='auto';b.style.padding='6px 10px';b.textContent='Update';};
 b.appendChild(x);
 setTimeout(function(){if(b.textContent.indexOf('Updating')<0&&b.parentNode){b.style.left='auto';b.style.padding='6px 10px';b.textContent='Update';}},8000);
 b.onclick=function(){if(window.dreamsSaveNow){try{window.dreamsSaveNow();}catch(e){}}b.textContent='Updating...';setTimeout(function(){w.postMessage('claim');setTimeout(function(){location.reload();},2500);},1200);};
 (document.body?Promise.resolve():new Promise(function(r){document.addEventListener('DOMContentLoaded',r);})).then(function(){document.body.appendChild(b);});
}
navigator.serviceWorker.getRegistration().then(function(r){
 if(!r)return;
 var check=function(){r.update().catch(function(){});};
 if(r.waiting&&navigator.serviceWorker.controller)apply(r.waiting);
 r.addEventListener('updatefound',function(){var w=r.installing;if(!w)return;w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)apply(w);});});
 check();
 document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
 setInterval(check,10*60*1000);
});
})();
</script>
<script>
(function(){
function saveNow(){if(window.dreamsSaveNow){try{window.dreamsSaveNow();}catch(e){}}}
document.addEventListener('visibilitychange',function(){if(document.hidden)saveNow();});
window.addEventListener('pagehide',saveNow);
try{var bc=new BroadcastChannel('dreams');var me=Math.random();bc.onmessage=function(e){if(e.data&&e.data.hi&&e.data.hi!==me){saveNow();window.dreamsOtherOpen=true;bc.postMessage({here:me});}else if(e.data&&e.data.here&&e.data.here!==me){window.dreamsOtherOlder=true;}};bc.postMessage({hi:me});}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
</script>
<script>
(function(){
window.dreamsStandalone=!!((window.matchMedia&&matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches)||navigator.standalone);
// Android back: keep one history entry of our own; each back press is counted for the game (DisplayMode polls dreamsBack).
window.dreamsBack=0;
var armed=false;
function arm(){if(armed)return;armed=true;try{history.pushState({dreams:1},'');}catch(e){}}
window.addEventListener('pointerdown',arm,true);
window.addEventListener('touchstart',arm,true);
window.addEventListener('popstate',function(){window.dreamsBack=(window.dreamsBack|0)+1;armed=false;arm();});
// Phone turned sideways in a browser tab.
function rot(){if(document.getElementById('dreams-rot')||!document.body)return;var d=document.createElement('div');d.id='dreams-rot';d.textContent='Turn your phone upright to play Dreams';document.body.appendChild(d);}
if(document.body)rot();else document.addEventListener('DOMContentLoaded',rot);
})();
</script>
