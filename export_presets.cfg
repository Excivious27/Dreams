html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"theme-color\" content=\"#121220\">\n<style>#status{background:#121220!important}#status-progress{width:70%!important;max-width:360px;height:14px;accent-color:#f2c55c}#status-notice{font-family:sans-serif}#status::before{content:\"DREAMS\";display:block;color:#f2c55c;font:bold 32px sans-serif;letter-spacing:6px;margin-bottom:18px;text-align:center}</style>\n<script>\n(function(){\nif(!('serviceWorker' in navigator))return;\nvar reloading=false;\nnavigator.serviceWorker.addEventListener('controllerchange',function(){if(reloading)return;reloading=true;location.reload();});\nfunction apply(w){\n window.dreamsUpdateReady=true;\n var loading=document.getElementById('status');\n if(loading&&loading.style.display!=='none'&&getComputedStyle(loading).visibility!=='hidden'){w.postMessage('claim');return;}\n if(document.getElementById('dreams-upd'))return;\n var b=document.createElement('div');b.id='dreams-upd';\n b.textContent='New version of Dreams ready. Tap here to update (your farm is saved).';\n b.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:9999;background:#f2c55c;color:#1b1430;font:bold 15px sans-serif;padding:12px;border-radius:10px;text-align:center;box-shadow:0 2px 10px #0008';\n b.onclick=function(){if(window.dreamsSaveNow){try{window.dreamsSaveNow();}catch(e){}}b.textContent='Updating...';setTimeout(function(){w.postMessage('claim');setTimeout(function(){location.reload();},2500);},1200);};\n (document.body?Promise.resolve():new Promise(function(r){document.addEventListener('DOMContentLoaded',r);})).then(function(){document.body.appendChild(b);});\n}\nnavigator.serviceWorker.getRegistration().then(function(r){\n if(!r)return;\n var check=function(){r.update().catch(function(){});};\n if(r.waiting&&navigator.serviceWorker.controller)apply(r.waiting);\n r.addEventListener('updatefound',function(){var w=r.installing;if(!w)return;w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)apply(w);});});\n check();\n document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});\n setInterval(check,10*60*1000);\n});\n})();\n</script>\n<script>\n(function(){\nfunction saveNow(){if(window.dreamsSaveNow){try{window.dreamsSaveNow();}catch(e){}}}\ndocument.addEventListener('visibilitychange',function(){if(document.hidden)saveNow();});\nwindow.addEventListener('pagehide',saveNow);\ntry{var bc=new BroadcastChannel('dreams');var me=Math.random();bc.onmessage=function(e){if(e.data&&e.data.hi&&e.data.hi!==me){saveNow();window.dreamsOtherOpen=true;bc.postMessage({here:me});}else if(e.data&&e.data.here&&e.data.here!==me){window.dreamsOtherOlder=true;}};bc.postMessage({hi:me});}catch(e){}\ntry{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}\n})();\n</script>"
